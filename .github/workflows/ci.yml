name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Análisis estático
        run: flutter analyze

      # Las pruebas contra el backend real se omiten solas (necesitan MUTUALS_E2E=1).
      - name: Pruebas
        run: flutter test
